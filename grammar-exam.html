:root{
  --paper:#F6F7F9; --sheet:#FFFFFF; --ink:#1C2433; --muted:#5B6474; --line:#D9DDE3;
  --card-red:#C8324A; --card-red-soft:#F7DDE2; --graphite:#3A3F47;
  --ok:#1F7A4D; --ok-soft:#DDF0E5; --bad:#B42318; --bad-soft:#FBE3E0;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --serif:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15181D; --sheet:#1D2128; --ink:#E7EAF0; --muted:#A0A8B6; --line:#343A44;
  --card-red:#FF7D90; --card-red-soft:#3A2128; --graphite:#D3D7DE;
  --ok:#5CCB8F; --ok-soft:#173225; --bad:#FF8A7A; --bad-soft:#3B1F1C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#15181D; --sheet:#1D2128; --ink:#E7EAF0; --muted:#A0A8B6; --line:#343A44;
  --card-red:#FF7D90; --card-red-soft:#3A2128; --graphite:#D3D7DE;
  --ok:#5CCB8F; --ok-soft:#173225; --bad:#FF8A7A; --bad-soft:#3B1F1C; color-scheme:dark;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--card-red);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.bar h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.progress{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--card-red);transition:width .3s}
.meta{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);font-weight:700}
.theme{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:2px 12px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.theme:hover{color:var(--ink);border-color:var(--muted)}
.starttop{display:flex;justify-content:flex-end;padding-top:16px}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.nav a{flex:none;font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 12px;background:var(--sheet)}
.nav a:hover{color:var(--ink);border-color:var(--muted)}

/* start screen */
.start{padding:24px 0 40px}
.start h2{font-size:clamp(28px,6vw,40px);line-height:1.25;margin:0 0 12px;letter-spacing:.02em}
.start p{color:var(--muted);margin:0 0 8px;max-width:60ch}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:28px 0 18px}
.mode{text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:18px 18px 16px;cursor:pointer}
.mode:hover{border-color:var(--card-red)}
.mode b{display:block;font-size:18px;margin-bottom:4px}
.mode small{color:var(--muted);font-size:14px;line-height:1.6;display:block}
.resume{font-size:14px;color:var(--muted)}
.resume button{background:none;border:none;color:var(--card-red);text-decoration:underline;cursor:pointer;padding:0}
.structure{width:100%;border-collapse:collapse;font-size:14px;margin-top:22px;background:var(--sheet)}
.structure td,.structure th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.structure th{background:var(--paper);font-weight:500}

/* sections */
section.part{padding:30px 0 6px}
.part > h2{font-size:20px;margin:0 0 2px}
.part > .desc{color:var(--muted);font-size:14px;margin:0 0 16px}
.q{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 12px}
.q .stem{display:flex;gap:10px;font-family:var(--serif);font-size:17.5px;line-height:1.75}
.q .num{font-family:var(--sans);font-weight:700;color:var(--card-red);min-width:1.8em;font-variant-numeric:tabular-nums}
.zh{font-family:var(--sans)!important;font-size:16.5px!important}

/* answer-card bubbles */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:10px 0 0 2.3em}
.opt{display:flex;align-items:center;gap:10px;background:none;border:none;padding:5px 4px;border-radius:6px;cursor:pointer;text-align:left;font-family:var(--serif);font-size:16.5px}
.opt:hover:not(:disabled){background:var(--card-red-soft)}
.opt:disabled{cursor:default}
.bub{flex:none;width:30px;height:20px;border:1.5px solid var(--card-red);border-radius:50%;display:grid;place-items:center;font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--card-red);transition:background .15s}
.opt.sel .bub{background:var(--graphite);border-color:var(--graphite);color:transparent}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.right{color:var(--ok);font-weight:600}

/* passage */
.passage{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 12px;font-family:var(--serif);font-size:17.5px;line-height:1.85}
.passage h3{font-family:var(--sans);font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:500}
.passage p{margin:0 0 10px;text-indent:2em}
.blank{display:inline-block;min-width:3.6em;text-align:center;border-bottom:1.5px solid var(--ink);font-family:var(--sans);font-weight:700;font-size:14px;color:var(--card-red);text-indent:0;padding:0 4px}
.blank.filled{color:var(--ink)}

/* fill & translation */
.fill{display:flex;gap:8px;margin:10px 0 0 2.3em;flex-wrap:wrap}
.fill input{flex:1;min-width:160px;max-width:280px;padding:7px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--serif);font-size:17px}
.fill input.right{border-color:var(--ok);background:var(--ok-soft)}
.fill input.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea{display:block;width:calc(100% - 2.3em);margin:10px 0 0 2.3em;min-height:76px;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--serif);font-size:16.5px;resize:vertical}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:14.5px;font-weight:500}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--card-red);border-color:var(--card-red);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}

/* explanation */
.exp{margin:12px 0 0 2.3em;padding:10px 14px;border-left:3px solid var(--muted);background:var(--paper);border-radius:0 6px 6px 0;font-size:14.5px;line-height:1.75}
.exp.ok{border-color:var(--ok)}.exp.bad{border-color:var(--bad)}
.exp .verdict{font-weight:700;margin-bottom:2px}
.exp.ok .verdict{color:var(--ok)}.exp.bad .verdict{color:var(--bad)}
.exp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.exp dt{font-weight:700;color:var(--muted);white-space:nowrap}
.exp dd{margin:0}
.exp .en{font-family:var(--serif);font-size:16px}
.self{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px}
.self label{display:flex;gap:6px;align-items:center;cursor:pointer}
.hidden{display:none!important}
.exam-mode .chk{display:none}

/* submit & results */
.submitbox{text-align:center;padding:26px 0 70px}
.submitbox p{color:var(--muted);font-size:14px;margin:8px 0 0}
.results{padding:34px 0 10px}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-size:clamp(56px,14vw,84px);font-weight:700;line-height:1;color:var(--card-red);font-variant-numeric:tabular-nums}
.score .of{font-size:20px;color:var(--muted)}
.results .note{color:var(--muted);font-size:14px;margin:6px 0 20px}
.tbl{width:100%;border-collapse:collapse;background:var(--sheet);font-size:15px;margin-bottom:24px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.diag{display:grid;gap:10px;margin:0 0 20px}
.drow{display:grid;grid-template-columns:minmax(150px,13em) 1fr 4.5em;gap:12px;align-items:center;font-size:15px}
.dbar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.dbar span{display:block;height:100%;background:var(--ok)}
.drow.weak .dbar span{background:var(--bad)}
.drow .r{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.advice{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:15px}
.advice h3{margin:0 0 6px;font-size:16px}
.advice ul{margin:0;padding-left:1.2em}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
.only-wrong .q.is-right,.only-wrong .passage.all-right{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:560px){.opts{grid-template-columns:1fr;margin-left:0}.fill,.exp,textarea{margin-left:0}textarea{width:100%}.drow{grid-template-columns:1fr 3.5em}.drow .dbar{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.bar,.submitbox,.tools,.modes{display:none}body{background:#fff}}
.homelink{color:var(--muted);font-weight:400;font-size:14px;margin-right:auto}
.homelink.barhome{margin-right:0}
.starttop{display:flex;align-items:center;gap:12px}
</style>
</head>

const STORE='gsat-grammar-test-v1';
let S={mode:null,ans:{},rev:{},self:{},submitted:false,deadline:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
function load(){try{const v=localStorage.getItem(STORE);return v?JSON.parse(v):null}catch(e){return null}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}

const ALLMC=[...PUB.p1,...PUB.p2,...PUB.pass.flatMap(p=>p.items)];
const L='ABCD';
function mcHTML(it,withStem){
  return `<div class="q" id="q${it.n}" data-n="${it.n}">
    ${withStem?`<div class="stem"><span class="num">${it.n}.</span><span>${esc(it.q)}</span></div>`:`<div class="stem"><span class="num">${it.n}.</span><span class="zh" style="color:var(--muted)">第 ${it.n} 格</span></div>`}
    <div class="opts" role="radiogroup" aria-label="第 ${it.n} 題選項">${it.o.map((o,i)=>`<button class="opt" role="radio" aria-checked="false" data-n="${it.n}" data-v="${L[i]}"><span class="bub">${L[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="exp hidden"></div></div>`;
}
function build(){
  const secs=[['p1','一、語境文法選擇','依上下文選出最適當的選項。每題 2 分。'],['p2','二、轉承語選擇','判斷前後句的邏輯關係，選出最適當的轉承語。每題 2 分。'],['pass','三、短文克漏字','依文意選出最適當的選項。每題 2 分。'],['p4','四、字形變化填充','依括號內的提示字，寫出符合句意與語法的正確形式。每題 1.5 分。'],['p5','五、句型翻譯','將中文譯成英文。寫完後看參考譯句，依評分標準自評，每題 3 分。']];
  let h='';
  for(const [k,t,dsc] of secs){
    h+=`<section class="part" id="s-${k}"><h2>${t}</h2><p class="desc">${dsc}</p>`;
    if(k==='p1'||k==='p2') h+=PUB[k].map(it=>mcHTML(it,true)).join('');
    if(k==='pass') PUB.pass.forEach((p,pi)=>{
      h+=`<div class="passage" data-pi="${pi}"><h3>${esc(p.title)}</h3>${p.text.map(par=>'<p>'+esc(par).replace(/__(\d+)__/g,(m,x)=>`<span class="blank" id="b${x}">${x}</span>`)+'</p>').join('')}</div>`;
      h+=p.items.map(it=>mcHTML(it,false)).join('');});
    if(k==='p4') h+=PUB.p4.map(it=>`<div class="q" id="q${it.n}" data-n="${it.n}"><div class="stem"><span class="num">${it.n}.</span><span>${esc(it.q)}</span></div>
      <div class="fill"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-n="${it.n}" aria-label="第 ${it.n} 題答案"><button class="btn chk" data-n="${it.n}">檢查</button></div><div class="exp hidden"></div></div>`).join('');
    if(k==='p5') h+=PUB.p5.map(it=>`<div class="q" id="q${it.n}" data-n="${it.n}"><div class="stem"><span class="num">${it.n}.</span><span class="zh">${esc(it.q)}</span></div>
      <textarea data-n="${it.n}" placeholder="在這裡寫下英文譯句" aria-label="第 ${it.n} 題譯句"></textarea>
      <div class="fill"><button class="btn chk" data-n="${it.n}">看參考譯句並自評</button></div><div class="exp hidden"></div></div>`).join('');
    h+='</section>';
  }
  $('#paper').innerHTML=h;
  $('#nav').innerHTML=secs.map(([k,t])=>`<a href="#s-${k}">${t.split('、')[0]}、${t.split('、')[1].slice(0,4)}</a>`).join('');
}
function isRight(n){const k=KEY[n],a=S.ans[n];if(a==null||a==='')return false;
  if(n>=36&&n<=45)return k.a.includes(String(a).trim().toLowerCase().replace(/\s+/g,' '));return a===k.a;}
function selfPts(n){const s=S.self[n]||{};return (s.s?2:0)+(s.w?1:0)}
function showExp(n){
  const q=$('#q'+n),box=q.querySelector('.exp'),k=KEY[n];box.classList.remove('hidden');
  if(n<=35){const ok=isRight(n);box.className='exp '+(ok?'ok':'bad');
    const it=ALLMC.find(x=>x.n==n);
    box.innerHTML=`<div class="verdict">${S.ans[n]?(ok?'答對了':'答錯了'):'未作答'}　正解 (${k.a}) <span class="en">${esc(it.o[L.indexOf(k.a)])}</span></div><dl><dt>判斷線索</dt><dd>${esc(k.clue)}</dd><dt>錯誤選項</dt><dd>${esc(k.wrong)}</dd><dt>對應歷屆</dt><dd>${esc(k.ref)}</dd></dl>`;
    q.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.toggle('right',b.dataset.v===k.a);b.classList.toggle('wrong',b.dataset.v===S.ans[n]&&!ok)});
    q.classList.toggle('is-right',ok);
    const bl=$('#b'+n); if(bl){bl.textContent=it.o[L.indexOf(k.a)];bl.classList.add('filled')}
  } else if(n<=45){const ok=isRight(n);box.className='exp '+(ok?'ok':'bad');
    box.innerHTML=`<div class="verdict">${S.ans[n]?(ok?'答對了':'答錯了'):'未作答'}　答案 <span class="en">${esc(k.show)}</span></div><dl><dt>解析</dt><dd>${esc(k.clue)}</dd></dl>`;
    const inp=q.querySelector('input');inp.disabled=true;inp.classList.toggle('right',ok);inp.classList.toggle('wrong',!ok);q.querySelector('.chk').classList.add('hidden');q.classList.toggle('is-right',ok);
  } else {const s=S.self[n]||{};box.className='exp';
    box.innerHTML=`<dl><dt>參考譯句</dt><dd class="en">${esc(k.show)}</dd><dt>考查句型</dt><dd>${esc(k.clue)}</dd><dt>其他寫法</dt><dd>${esc(k.alt)}</dd><dt>對應歷屆</dt><dd>${esc(k.ref)}</dd></dl>
      <div class="self"><b>自評：</b><label><input type="checkbox" data-self="s" data-n="${n}" ${s.s?'checked':''}> 句型結構正確（2 分）</label><label><input type="checkbox" data-self="w" data-n="${n}" ${s.w?'checked':''}> 用字與拼字正確（1 分）</label></div>`;
    q.querySelector('textarea').disabled=S.submitted; q.querySelector('.chk').classList.add('hidden');q.classList.toggle('is-right',selfPts(n)===3);}
}
function syncInputs(){
  Object.entries(S.ans).forEach(([n,v])=>{n=+n;const q=$('#q'+n);if(!q)return;
    if(n<=35)q.querySelectorAll('.opt').forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('sel',on);b.setAttribute('aria-checked',on)});
    else if(n<=45)q.querySelector('input').value=v; else q.querySelector('textarea').value=v;});
  Object.keys(S.rev).forEach(n=>showExp(+n));
}
function progress(){const done=Object.values(S.ans).filter(v=>v!==''&&v!=null).length;$('#prog').style.width=(done/50*100)+'%';$('#count').textContent=`${done} / 50`;
  $('#submitHint').textContent=S.mode==='practice'?'練習模式也可以交卷，看總成績和考點診斷。':`已作答 ${done} 題，未作答的題目以 0 分計。`}
function start(mode,fresh){
  if(fresh)S={mode,ans:{},rev:{},self:{},submitted:false,deadline:mode==='exam'?Date.now()+60*60*1000:null};
  $('#start').classList.add('hidden');$('#starttop').classList.add('hidden');$('#bar').classList.remove('hidden');$('#paper').classList.remove('hidden');
  build();syncInputs();progress();
  if(S.submitted){renderResults();}else $('#submitbox').classList.remove('hidden');
  document.body.classList.toggle('exam-mode',S.mode==='exam'&&!S.submitted);
  if(S.mode==='exam'&&!S.submitted)tick();
  save();window.scrollTo(0,0);
}
function tick(){const t=$('#timer');t.classList.remove('hidden');
  const f=()=>{if(S.submitted){t.classList.add('hidden');return}const left=Math.max(0,S.deadline-Date.now());const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    t.textContent=`剩餘 ${m}:${String(s).padStart(2,'0')}`;t.classList.toggle('low',left<5*60000);
    if(left<=0){toast('時間到，已自動交卷');submit();return}setTimeout(f,1000)};f();}
function submit(){S.submitted=true;document.body.classList.remove('exam-mode');for(let n=1;n<=50;n++)S.rev[n]=true;save();
  document.querySelectorAll('.q').forEach(q=>showExp(+q.dataset.n));$('#submitbox').classList.add('hidden');$('#timer').classList.add('hidden');renderResults();
  $('#results').scrollIntoView({behavior:'smooth'});}
function renderResults(){
  const sec=[['一、語境文法選擇',1,15,2],['二、轉承語選擇',16,25,2],['三、短文克漏字',26,35,2],['四、字形變化填充',36,45,1.5],['五、句型翻譯（自評）',46,50,3]];
  let total=0,rows='';
  for(const [t,a,b,p] of sec){let got=0,c=0;for(let n=a;n<=b;n++){if(n>=46){got+=selfPts(n);if(selfPts(n)===3)c++}else if(isRight(n)){got+=p;c++}}
    total+=got;rows+=`<tr><td>${t}</td><td class="r">${c} / ${b-a+1}</td><td class="r">${got} / ${(b-a+1)*p}</td></tr>`;}
  const tagStat={};ALLMC.forEach(it=>{const s=tagStat[it.tag]||(tagStat[it.tag]={c:0,t:0});s.t++;if(isRight(it.n))s.c++});
  tagStat.w={c:PUB.p4.filter(it=>isRight(it.n)).length,t:10};
  const sp=PUB.p5.reduce((a,it)=>a+selfPts(it.n),0);tagStat.z={c:sp,t:15,pts:true};
  const order=['t','m','p','s','r','c','x','w','z'];
  const weak=order.filter(k=>tagStat[k].c/tagStat[k].t<0.6);
  const diag=order.map(k=>{const s=tagStat[k],pct=s.c/s.t;return `<div class="drow ${pct<0.6?'weak':''}"><span>${TAGS[k]}</span><div class="dbar"><span style="width:${pct*100}%"></span></div><span class="r">${s.c}/${s.t}${s.pts?' 分':''}</span></div>`}).join('');
  const adv=weak.length?`<div class="advice"><h3>建議加強</h3><ul>${weak.map(k=>`<li><b>${TAGS[k]}：</b>${ADVICE[k]}</li>`).join('')}</ul></div>`:`<div class="advice"><h3>表現穩定</h3>各類考點的答對率都在六成以上。可以挑錯題重看詳解，或回到單字表繼續背 A 級單字。</div>`;
  const selfDone=PUB.p5.some(it=>S.self[it.n]&&(S.self[it.n].s||S.self[it.n].w));
  $('#results').classList.remove('hidden');
  $('#results').innerHTML=`<h2 style="margin:0 0 6px">作答結果</h2><div class="score"><span class="big">${total%1?total.toFixed(1):total}</span><span class="of">/ 100 分</span></div>
   <p class="note">${selfDone?'翻譯題分數依你的自評計算。':'翻譯題還沒自評，目前以 0 分計算。往下到第五大題勾選自評後，分數會自動更新。'}</p>
   <table class="tbl"><tr><th>大題</th><th class="r">答對</th><th class="r">得分</th></tr>${rows}</table>
   <h2 style="font-size:18px;margin:0 0 10px">考點診斷</h2><div class="diag">${diag}</div>${adv}
   <div class="tools"><button class="btn" id="onlyWrong">只看錯題</button><button class="btn" id="toTop">回到第 1 題</button><button class="btn" id="retry">重新作答</button></div>`;
  $('#paper').parentNode.insertBefore($('#results'),$('#paper'));
  $('#onlyWrong').onclick=e=>{const on=document.body.classList.toggle('only-wrong');e.target.textContent=on?'顯示全部題目':'只看錯題';
    PUB.pass.forEach((p,pi)=>{$(`.passage[data-pi="${pi}"]`).classList.toggle('all-right',p.items.every(it=>isRight(it.n)))})};
  $('#toTop').onclick=()=>$('#s-p1').scrollIntoView({behavior:'smooth'});
  $('#retry').onclick=()=>{if(confirm('要清除這次的作答，重新開始嗎？')){try{localStorage.removeItem(STORE)}catch(e){}location.reload()}};
}
document.addEventListener('click',e=>{
  const m=e.target.closest('.mode');if(m){start(m.dataset.mode,true);return}
  const o=e.target.closest('.opt');if(o&&!o.disabled){const n=+o.dataset.n;S.ans[n]=o.dataset.v;
    o.parentNode.querySelectorAll('.opt').forEach(b=>{b.classList.toggle('sel',b===o);b.setAttribute('aria-checked',b===o)});
    if(S.mode==='practice'){S.rev[n]=true;showExp(n)}save();progress();return}
  const c=e.target.closest('.chk');if(c){const n=+c.dataset.n;
    if(S.mode==='exam'&&!S.submitted&&n<=45){toast('測驗模式交卷後才會顯示答案');return}
    if(n>=46&&S.mode==='exam'&&!S.submitted){toast('測驗模式交卷後才能看參考譯句');return}
    S.rev[n]=true;showExp(n);save();return}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.self){const n=+t.dataset.n;S.self[n]=S.self[n]||{};S.self[n][t.dataset.self]=t.checked;save();$('#q'+n).classList.toggle('is-right',selfPts(n)===3);if(S.submitted)renderResults();return}
  if(t.dataset.n&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')){S.ans[+t.dataset.n]=t.value;save();progress()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.dataset.n){const b=e.target.parentNode.querySelector('.chk');if(b&&!b.classList.contains('hidden'))b.click()}});
$('#submitBtn').onclick=()=>{const done=Object.values(S.ans).filter(v=>v).length;if(done<50&&!confirm(`還有 ${50-done} 題沒作答，確定要交卷嗎？`))return;submit()};
const THEMES=['auto','light','dark'],TLABEL={auto:'顯示：跟隨系統',light:'顯示：淺色',dark:'顯示：深色'};
function applyTheme(t){if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('[data-theme-btn]').forEach(b=>b.textContent=TLABEL[t]);try{localStorage.setItem(STORE+'-theme',t)}catch(e){}}
let curTheme='auto';try{curTheme=localStorage.getItem(STORE+'-theme')||'auto'}catch(e){}
applyTheme(curTheme);
document.querySelectorAll('[data-theme-btn]').forEach(b=>b.addEventListener('click',()=>{curTheme=THEMES[(THEMES.indexOf(curTheme)+1)%3];applyTheme(curTheme);toast(TLABEL[curTheme])}));
const prev=load();if(prev&&prev.mode){$('#resume').classList.remove('hidden');$('#resumeBtn').onclick=()=>{S=prev;start(S.mode,false)}}
</script>
</body>
</html>
